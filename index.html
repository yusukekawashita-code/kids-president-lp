<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>ママラボ | キッズ社長体験</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <body>
    <header class="header">
      <div class="header__inner">

        <nav class="header__nav" aria-label="グローバルナビゲーション">
          <ul class="header__nav-list">
            <li class="header__nav-item">
              <a href="#experience" class="header__nav-link">こんな体験ができます</a>

            <li class="header__nav-item">
              <a href="#overview" class="header__nav-link">開催概要</a>
            </li>
            <li class="header__nav-item">
              <a href="#faq" class="header__nav-link">よくある質問</a>
            </li>

          <a href="#contact" class="header__button">

        <button class="header__hamburger" type="button" aria-label="メニューを開く" aria-controls="drawer" aria-expanded="false">

      </div>
      <div class="header__drawer" id="drawer">
        <nav class="header__drawer-nav" aria-label="スマートフォンナビゲーション">
          <ul class="header__drawer-list">
            <li class="header__drawer-item">
              <a href="#experience" class="header__drawer-link">こんな体験ができます</a>
            </li>

            <li class="header__drawer-item">
              <a href="#overview" class="header__drawer-link">開催概要</a>
            </li>

            <li class="header__drawer-item">
              <a href="#faq" class="header__drawer-link">よくある質問</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <section class="main-visual">
      <picture class="main-visual__image">
        <source srcset="images/main-visual-sp.jpg" media="(max-width: 768px)" />

        <img src="images/main-visual-pc.jpg" alt="キッズ社長体験 メインビジュアル" width="1920" height="942" decoding="async" />
      </picture>
    </section>
    <main></main>
    <footer></footer>
